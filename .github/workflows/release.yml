name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: release-notes.md
      # What the release added or changed the look of, as the stand draws it:
      # the visual gate's baselines, committed before the tag and linked at it.
      # Node alone - it reads committed files and needs no install.
      - name: Add the pictures from the stand
        run: node tools/release-notes.mjs "$GITHUB_REF_NAME" >> release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
