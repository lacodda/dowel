name: Publish

# Triggered by the tag push directly (not the release event): releases here
# are created by release.yml with GITHUB_TOKEN, and such events do not start
# other workflows.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.1.0)
        required: true

permissions: {}

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
      # npm >= 11.5.1 exchanges the OIDC token itself (trusted publishing);
      # provenance is attached automatically.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The root README reaches the npm page through the package's `prepack`
      # script, so a manual `npm publish` ships the same file as CI.
      - run: npm publish
        working-directory: packages/dowel
