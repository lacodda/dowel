name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']
  # Recording the baselines. They have to be made in the environment that will
  # later compare against them, and that environment is this container - not a
  # maintainer's laptop, where the fonts and the anti-aliasing differ. Run this
  # by hand after a deliberate visual change, and commit the artifact.
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Record new stand baselines and accessibility reports instead of comparing'
        type: boolean
        default: false

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and its tags: `tests/history.test.ts` reads
          # each item's history out of git and compares it with the file.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The palettes are resolved by a real browser (tools/build-palettes.mjs),
      # so every job that builds the package needs one.
      - name: Install the browser the palettes are resolved in
        run: pnpm exec playwright install --with-deps chromium
      - name: Lint and typecheck
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  visual:
    name: stand snapshots
    # Linux only, and deliberately: the theme asks for the operating system's
    # own typeface, so a screenshot taken on Windows can never equal one taken
    # on Linux. Pinning a platform is what makes the baselines mean something.
    # The container is the image the baselines are recorded in, so the
    # rendering matches down to the anti-aliasing.
    #
    # This tag and `@playwright/test` in package.json move together, and the
    # dependency is pinned without a caret for that reason: a minor bump of the
    # package asks for a browser revision the image does not carry, and every
    # snapshot fails with "Executable doesn't exist" rather than a diff. Raising
    # the pair is its own change, because a new image re-renders every baseline.
    #
    # It happened exactly as written during v0.24: the stack update took the
    # package to 1.63.0 and left the image at 1.62.1, and all 140 of them failed
    # that way. The note was right; what was missing was anything that enforces
    # it, which `tests/toolchain.test.ts` now does.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the stand
        run: pnpm stand:build

      # The pictures, the measurements, and the keyboard driving every overlay
      # and menu: all three need the stand served in a real browser.
      - name: Compare the stand with its baselines
        if: ${{ inputs.update_snapshots != true }}
        run: pnpm exec playwright test tests/visual/stand.spec.ts tests/visual/measured.spec.ts tests/visual/modes.spec.ts tests/visual/keyboard.spec.ts
      - name: Keep the diffs, so a failure can be looked at
        if: ${{ failure() && inputs.update_snapshots != true }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: test-results/
          retention-days: 7

      - name: Record new baselines
        if: ${{ inputs.update_snapshots == true }}
        run: pnpm exec playwright test tests/visual/stand.spec.ts tests/visual/modes.spec.ts --update-snapshots
      - name: Hand the baselines back to be committed
        if: ${{ inputs.update_snapshots == true }}
        uses: actions/upload-artifact@v7
        with:
          name: stand-baselines
          path: tests/visual/**/*.png
          retention-days: 7

  accessibility:
    name: stand accessibility
    # axe over every section of the stand, in both themes, in the same
    # container as the pictures - the browser that renders them is the one
    # that resolves the colours contrast is measured in. A job of its own
    # because it is a hundred and twenty pages twice: beside the pictures
    # rather than after them, and four at a time, since nothing here is a
    # comparison of pixels that a busy machine could disturb.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the stand
        run: pnpm stand:build

      - name: Hold the stand to its accessibility report
        if: ${{ inputs.update_snapshots != true }}
        run: pnpm exec playwright test tests/visual/a11y.spec.ts --workers=4
      - name: Keep what failed, so it can be looked at
        if: ${{ failure() && inputs.update_snapshots != true }}
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-failures
          path: test-results/
          retention-days: 7

      - name: Record the report again
        if: ${{ inputs.update_snapshots == true }}
        run: pnpm exec playwright test tests/visual/a11y.spec.ts --workers=4 --update-snapshots
      - name: Hand the report back to be committed
        if: ${{ inputs.update_snapshots == true }}
        uses: actions/upload-artifact@v7
        with:
          name: stand-accessibility
          path: docs/src/data/accessibility/
          retention-days: 7
