name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and typecheck
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  visual:
    name: stand snapshots
    # Linux only, and deliberately: the theme asks for the operating system's
    # own typeface, so a screenshot taken on Windows can never equal one taken
    # on Linux. Pinning a platform is what makes the baselines mean something.
    # The container is the same image the baselines were recorded in, so the
    # rendering matches down to the anti-aliasing.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the stand
        run: pnpm stand:build
      - name: Compare the stand with its baselines
        run: pnpm visual
      - name: Keep the diffs, so a failure can be looked at
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: test-results/
          retention-days: 7
