name: Docs

on:
  push:
    branches: [main]
    # The stand reads the theme straight from the package, so a token that
    # changes there changes the token page too.
    paths: ['docs/**', 'packages/dowel/src/theme.css', 'registry/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      # Two installs, because the stand renders files from outside its own
      # package: the registry components live at the repository root, and
      # pnpm resolves their imports from there. Installing only `docs` builds
      # fine on a machine that has both and fails here with "failed to resolve
      # import @radix-ui/react-slot".
      - name: Install the workspace
        run: pnpm install --frozen-lockfile
      - name: Install the docs site
        run: pnpm install --frozen-lockfile
        working-directory: docs
      - name: Build
        run: pnpm build
        working-directory: docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
