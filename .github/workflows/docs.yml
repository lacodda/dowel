name: Docs

on:
  push:
    branches: [main]
    # The stand reads the theme straight from the package, so a token that
    # changes there changes the token page too.
    paths: ['docs/**', 'stand/**', 'demo/**', 'fixtures/**', 'packages/dowel/src/theme.css', 'registry/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The registry pins every component to `dowel-ui@^<this version>`, so a site
  # deployed before npm has that version promises an install that fails
  # (ETARGET, seen live in v0.29.1, when this job beat the publish by a
  # minute). A push that raised the version deploys nothing: the release's
  # publish job sends the docs out once npm serves it, and waits here for the
  # registry to answer.
  npm:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.version.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
      - name: Is this version on npm?
        id: version
        env:
          # Asked for by the publish job: npm may take a moment to answer.
          ATTEMPTS: ${{ github.event_name == 'workflow_dispatch' && '20' || '1' }}
        run: |
          version=$(node -p "require('./packages/dowel/package.json').version")
          for attempt in $(seq "$ATTEMPTS"); do
            if npm view "dowel-ui@$version" version >/dev/null 2>&1; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$attempt" -lt "$ATTEMPTS" ] && sleep 15
          done
          echo "dowel-ui@$version is not on npm yet; the release's publish job deploys the docs."
          echo "ready=false" >> "$GITHUB_OUTPUT"

  build:
    needs: npm
    if: ${{ needs.npm.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # The runner caches an older 22.x; Astro raises its Node floor by patch releases.
          check-latest: true
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      # The workspace, for the stand: it renders the registry components, which
      # live at the repository root. The docs site installs separately - it is
      # outside the workspace on purpose.
      - name: Install the workspace
        run: pnpm install --frozen-lockfile
      - name: Install the docs site
        run: pnpm install --frozen-lockfile
        working-directory: docs
      - name: Build the docs
        run: pnpm build
        working-directory: docs
      # The stand is a separate application published under the same project
      # page: the documentation explains a component, the stand shows it in a
      # page of its own - real theme, real reset, no other site's CSS.
      - name: Build the stand
        run: pnpm --filter dowel-stand build
      - name: Put the stand under the docs
        run: cp -r stand/dist docs/dist/stand
      # kilna-lite: a small product built from the blocks, on the stand's
      # fictional world. It routes by hash, so it needs no 404 handoff.
      - name: Build the demo
        run: pnpm --filter dowel-demo build
      - name: Put the demo under the docs
        run: cp -r demo/dist docs/dist/demo
      # Pages serves one 404 for the whole site and it is the documentation's,
      # so the stand's client-side routes reach it rather than the stand. This
      # teaches that page to hand a stand path back to the stand.
      - name: Teach the 404 about the stand's routes
        run: node tools/build-404.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
